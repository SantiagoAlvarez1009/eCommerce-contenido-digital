{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="card">
  <h1>{{ title }}</h1>
  <form method="post" enctype="multipart/form-data">{% csrf_token %}
    {% include 'partials/form.html' %}
    <button type="submit">Guardar</button>
    <a href="{% url 'products:list' %}">Cancelar</a>
  </form>
</div>
{% endblock %}
