{% extends 'base.html' %}
{% block title %}Recuperar contraseña{% endblock %}
{% block content %}
<div class="row justify-content-center my-5">
  <div class="col-md-8 col-lg-5 col-xl-4">
    <p class="eyebrow mb-2">Cuenta</p>
    <h1 class="display-6 mb-3">Recuperar contraseña</h1>
    <p class="muted mb-5">Ingresa tu correo y te enviaremos un enlace temporal para definir una nueva contraseña.</p>
    <form method="post">{% csrf_token %}
      {% include 'partials/form.html' %}
      <button type="submit" class="btn btn-dark w-100">Enviar enlace</button>
    </form>
  </div>
</div>
{% endblock %}
