<table class="table align-middle">
  <thead><tr><th>Producto</th><th class="text-end">Precio</th></tr></thead>
  <tbody>
    {% for item in order.items.all %}
    <tr><td>{{ item.product.name }}</td><td class="text-end fw-light">${{ item.price }}</td></tr>
    {% endfor %}
  </tbody>
  <tfoot>
    <tr><th>Total</th><th class="text-end fs-5 fw-light">${{ order.total }}</th></tr>
  </tfoot>
</table>
